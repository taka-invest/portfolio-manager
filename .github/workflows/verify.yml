name: Verify Portfolio Manager

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop and mobile)
        run: npm run test:browser
      - name: Save browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 5
