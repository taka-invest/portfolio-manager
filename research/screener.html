</style>

<script>
// ── ティッカーリスト ────────────────────────────

const TICKER_LISTS = {

    // Mega-cap Tech (IVW上位10、index weight ~65%)

    // Pharma/Biotech
    'LLY','VRTX','REGN','AMGN','ABBV','ISRG',
    // Financials (growth-oriented)
    'JPM','V','MA','GS','BX','SPGI','MCO','COIN',
    // Semis & Hardware
    'LRCX','AMAT','KLAC','QCOM','MRVL','ADI','ANET','MPWR','ON',
    // Enterprise Software / Cloud
    'ORCL','NOW','CRM','ADBE','INTU','PANW','CRWD','DDOG','TTD','AXON',
    // Consumer / Travel
    'NFLX','BKNG','UBER','COST','APP',
    // Industrials / Other
    'CAT','GEV','PLTR','CSCO','TXN',
  ],
  russell2000_growth: [
    // ── IWO実際の上位保有銘柄（stockanalysis.com取得）──
    'BE','CRDO','STRL','FN','IONQ','RMBS','GH','MOD','SITM',
    'SMTC','DY','DOCN','AEIS','SPXC','VIAV','BBIO','KTOS','ARWR',
    'AXSM','ENSG','GTLS','AGX','AAOI',

    // ── 半導体・ハードウェア（小型）──
    'AMBA','POWI','COHU','NVTS','AIOT','LASR','ONTO','ACLS',
    'FORM','ICHR','MTSI','DIOD','SMFL','SITM','OSIS','PI',

    // ── SaaS・ソフトウェア小型──
    'BRZE','KVYO','APPF','JAMF','SMAR','TASK','ARLO',
    'PCVX','ALKT','VERX','WEAV','CLBT','INTA','SEAT',
    'FROG','CWAN','DOMO','LPSN','PLTK',

    // ── AI・データ・サイバーセキュリティ小型──
    'SOUN','BBAI','GRRR','INOD','AI','DTSI','RAMP',
    'BSIG','VNET','NLOK',

    // ── 量子コンピューター──
    'QUBT','RGTI','QMCO',

    // ── 宇宙・ドローン・防衛テック──
    'LUNR','SPIR','RCAT','AVAV','BWXT','LDOS','KRNT',
    'ACHR','JOBY','LILM','RKLB',

    // ── バイオテック（成長期）──
    'RXRX','ARWR','AXSM','BBIO','VERV','CRVS','KROS','LEGN',

    // ── ヘルスケアIT・医療機器──
    'HIMS','ACCD','GDRX','DOCS','ONEM','STVN','PRAX',
    'AXNX','NVCR','SWAV','GRAL',

    // ── 消費者・ブランド成長──
    'XPOF','RELY','CELH','CAVA','WING','BIRD','BROS',
    'CAKE','JACK','PLAY','DNUT','PTON','XRAY',

    // ── インフラ・産業テック──
    'IREN','CORZ','GEV','MKSI','SPXC','STRL','DY',
    'IESC','POWL','GBCI','GRBK','TMHC',

    // ── フィンテック小型──
    'RELY','RPAY','PAYA','IIIV','NRDS',
  ],

// 全リスト（重複除去）
const allTickers = [...new Set([
  ...TICKER_LISTS.nasdaq100,
  ...TICKER_LISTS.sp500_growth,
  ...TICKER_LISTS.russell2000_growth,
])];
TICKER_LISTS.all = allTickers;

// カウント表示
document.getElementById('cnt-nasdaq100').textContent = TICKER_LISTS.nasdaq100.length + '銘柄';
document.getElementById('cnt-sp500_growth').textContent = TICKER_LISTS.sp500_growth.length + '銘柄';
document.getElementById('cnt-russell2000_growth').textContent = TICKER_LISTS.russell2000_growth.length + '銘柄';
document.getElementById('cnt-all').textContent = allTickers.length + '銘柄';

// ── 状態管理 ─────────────────────────────────────
let currentIndex = 'nasdaq100';
let allResults   = [];
let sortCol      = 'signalScore';
let sortDir      = 'desc';
let scanning     = false;

// ── インデックス選択 ──────────────────────────────
document.querySelectorAll('.index-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.index-btn').forEach(b => {
      b.style.background = 'rgba(0,0,0,0.04)';
      b.style.borderColor = 'rgba(0,0,0,0.12)';
      b.style.color = 'rgba(28,25,23,0.45)';
    });
    btn.style.background = 'rgba(99,102,241,0.12)';
    btn.style.borderColor = 'rgba(99,102,241,0.4)';
    btn.style.color = '#4f46e5';
    currentIndex = btn.dataset.index;
  });
});

// フィルター変更でリロード
document.getElementById('minScoreSlider').addEventListener('input', function() {
  document.getElementById('minScoreLabel').textContent = this.value + '%';
  renderTable();
});
document.getElementById('phaseFilter').addEventListener('change', renderTable);
document.getElementById('hideFinancial').addEventListener('change', renderTable);

// ── メインスキャン関数 ──────────────────────────
async function startScan() {
  if (scanning) return;
  scanning = true;

  const tickers = TICKER_LISTS[currentIndex] ?? [];
  allResults = [];

  // UI初期化
  document.getElementById('progressArea').classList.remove('hidden');
  document.getElementById('summaryCards').classList.add('hidden');
  document.getElementById('resultsSection').classList.add('hidden');
  document.getElementById('resultsBody').innerHTML = '';
  document.getElementById('scanBtn').disabled = true;
  document.getElementById('scanBtn').textContent = '⏳ スキャン中...';
  updateProgress(0, tickers.length);

  const BATCH_SIZE = 10;
  const batches = [];
  for (let i = 0; i < tickers.length; i += BATCH_SIZE) {
    batches.push(tickers.slice(i, i + BATCH_SIZE));
  }

  let done = 0, errors = 0;

  // バッチを最大6並列で実行（ブラウザ接続数制限を考慮）
  const MAX_CONCURRENT = 6;
  const batchQueue = [...batches];
  const running = [];

  async function runBatch(batch) {
    try {
      const res = await fetch('/.netlify/functions/screener', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tickers: batch }),
      });
      const data = await res.json();
      if (Array.isArray(data)) {
        for (const item of data) {
          if (item.error) errors++;
          else { allResults.push(item); }
          done++;
        }
      }
    } catch(e) {
      errors += batch.length;
      done   += batch.length;
    }
    updateProgress(done, tickers.length, errors);
    updateStats();
    renderTable();
  }

  // キューを処理
  const executeBatches = async () => {
    const inFlight = [];
    for (const batch of batches) {
      if (inFlight.length >= MAX_CONCURRENT) {
        await Promise.race(inFlight);
      }
      const p = runBatch(batch).then(() => {
        inFlight.splice(inFlight.indexOf(p), 1);
      });
      inFlight.push(p);
    }
    await Promise.all(inFlight);
  };

  await executeBatches();

  // 完了
  scanning = false;
  document.getElementById('scanBtn').disabled = false;
  document.getElementById('scanBtn').textContent = '🔍 スキャン開始';
  document.getElementById('progressLabel').textContent = `スキャン完了 — ${done}銘柄分析`;
  document.getElementById('summaryCards').classList.remove('hidden');
  document.getElementById('resultsSection').classList.remove('hidden');
  updateStats();
  renderTable();
}

function updateProgress(done, total, errors = 0) {
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressLabel').textContent = `分析中... ${done} / ${total}`;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statError').textContent = errors;
}

function updateStats() {
  const high   = allResults.filter(r => r.signalScore >= 75).length;
  const mid    = allResults.filter(r => r.signalScore >= 50 && r.signalScore < 75).length;
  const phase1 = allResults.filter(r => r.phase === 'phase1').length;
  document.getElementById('statHigh').textContent    = high;
  document.getElementById('statPhase1').textContent  = phase1;
  document.getElementById('sumTotal').textContent    = allResults.length + '銘柄';
  document.getElementById('sumHigh').textContent     = high + '銘柄';
  document.getElementById('sumMid').textContent      = mid + '銘柄';
  document.getElementById('sumPhase1').textContent   = phase1 + '銘柄';
}

// ── テーブル描画 ──────────────────────────────────
function getFilteredSorted() {
  const minScore     = parseInt(document.getElementById('minScoreSlider').value) || 0;
  const phaseFilter  = document.getElementById('phaseFilter').value;
  const hideFin      = document.getElementById('hideFinancial').checked;

  let rows = [...allResults];
  if (minScore > 0)              rows = rows.filter(r => r.signalScore >= minScore);
  if (phaseFilter !== 'all')     rows = rows.filter(r => r.phase === phaseFilter);
  if (hideFin)                   rows = rows.filter(r => !r.isFinancial);

  rows.sort((a, b) => {
    const va = a[sortCol] ?? -999;
    const vb = b[sortCol] ?? -999;
    if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortDir === 'asc' ? va - vb : vb - va;
  });
  return rows;
}

function phaseBadge(phase) {
  const map = {
    phase1:    '<span class="bg-purple-100 text-purple-700 border border-purple-300 rounded px-1.5 py-0.5">🌱P1</span>',
    phase2:    '<span class="bg-amber-100 text-amber-700 border border-amber-300 rounded px-1.5 py-0.5">⚡P2</span>',
    phase3:    '<span class="bg-emerald-100 text-emerald-700 border border-emerald-300 rounded px-1.5 py-0.5">🏆P3</span>',
    financial: '<span class="bg-orange-100 text-orange-700 border border-orange-300 rounded px-1.5 py-0.5">🏦金融</span>',
  };
  return map[phase] ?? '<span class="text-stone-300">—</span>';
}

function scoreBadge(score) {
  if (!score || score < 25) return '<span class="text-stone-300">—</span>';
  if (score >= 75) return `<span class="font-black text-red-700 bg-red-100 border border-red-300 rounded-full px-2 py-0.5">🚨 ${score}%</span>`;
  if (score >= 50) return `<span class="font-bold text-orange-700 bg-orange-100 border border-orange-300 rounded-full px-2 py-0.5">⚡ ${score}%</span>`;
  return `<span class="text-stone-500 bg-stone-100 border border-stone-300 rounded-full px-2 py-0.5">📌 ${score}%</span>`;
}

function fmtRof(v) {
  if (v === null || v === undefined) return '<span class="text-stone-300">—</span>';
  if (v >= 100) return `<span class="text-amber-600 font-black">${v.toFixed(0)}</span>`;
  if (v >= 60)  return `<span class="text-emerald-600 font-bold">${v.toFixed(0)}</span>`;
  if (v >= 40)  return `<span class="text-emerald-500">${v.toFixed(0)}</span>`;
  return `<span class="text-stone-400">${v.toFixed(0)}</span>`;
}

function fmtPct(v, colored = true) {
  if (v === null || v === undefined) return '<span class="text-stone-300">—</span>';
  if (!colored) return `<span class="text-stone-500">${v >= 0 ? '+' : ''}${v.toFixed(1)}%</span>`;
  const c = v >= 20 ? 'text-emerald-600' : v >= 0 ? 'text-emerald-500' : v >= -10 ? 'text-amber-500' : 'text-red-500';
  return `<span class="${c}">${v >= 0 ? '+' : ''}${v.toFixed(1)}%</span>`;
}

function fmtMktcap(v) {
  if (!v) return '<span class="text-stone-300">—</span>';
  const b = v / 1e9;
  if (b >= 1000) return `<span class="text-stone-600">$${(b/1000).toFixed(1)}T</span>`;
  if (b >= 100)  return `<span class="text-stone-600">$${b.toFixed(0)}B</span>`;
  return `<span class="text-stone-500">$${b.toFixed(1)}B</span>`;
}

function signalFlagStr(flags) {
  if (!flags) return '';
  const parts = [];
  if (flags.redToBlack)    parts.push('<span class="text-purple-600">黒字化</span>');
  if (flags.opMInflection) parts.push('<span class="text-orange-600">OpM+</span>');
  if (flags.rof40Cross40)  parts.push('<span class="text-emerald-600">RoF40</span>');
  if (flags.rof40Cross60)  parts.push('<span class="text-emerald-700">RoF60</span>');
  if (flags.rof40Cross80)  parts.push('<span class="text-amber-600">RoF80</span>');
  return parts.join('<span class="text-stone-300 mx-0.5">·</span>');
}

function rowBgClass(r) {
  if (r.signalScore >= 75) return 'bg-red-50/80 border-b border-red-200/60';
  if (r.signalScore >= 50) return 'bg-orange-50/60 border-b border-stone-200';
  return 'border-b border-stone-100';
}

function renderTable() {
  const rows = getFilteredSorted();
  document.getElementById('resultCount').textContent = `(${rows.length}銘柄表示)`;

  const tbody = document.getElementById('resultsBody');
  tbody.innerHTML = rows.map((r, i) => `
    <tr class="result-row ${rowBgClass(r)} row-enter" onclick="openAnalysis('${r.ticker}')">
      <td class="px-3 py-2 text-stone-400">${i + 1}</td>
      <td class="px-3 py-2">
        <div class="font-black text-base ${r.signalScore >= 75 ? 'text-red-600' : r.signalScore >= 50 ? 'text-orange-600' : 'text-stone-800'}">${r.ticker}</div>
        <div class="text-stone-400 text-xs">${(r.name ?? '').substring(0,20)}</div>
      </td>
      <td class="px-3 py-2">${phaseBadge(r.phase)}</td>
      <td class="px-3 py-2 text-right">${scoreBadge(r.signalScore)}</td>
      <td class="px-3 py-2 text-right">${fmtRof(r.rof40)}</td>
      <td class="px-3 py-2 text-right">${fmtPct(r.opMargin)}</td>
      <td class="px-3 py-2 text-right">
        ${fmtPct(r.revYoY, true)}
        ${r.yoyAccel !== null ? `<span class="text-xs ml-0.5 ${r.yoyAccel >= 10 ? 'text-emerald-500' : r.yoyAccel <= -10 ? 'text-red-500' : 'text-stone-300'}">${r.yoyAccel >= 10 ? '↑↑' : r.yoyAccel >= 5 ? '↑' : r.yoyAccel <= -10 ? '↓↓' : r.yoyAccel <= -5 ? '↓' : ''}</span>` : ''}
      </td>
      <td class="px-3 py-2 text-right">
        <span class="${r.grossMargin !== null ? (r.grossMargin > 60 ? 'text-emerald-600' : r.grossMargin > 40 ? 'text-emerald-500' : r.grossMargin > 20 ? 'text-amber-500' : 'text-stone-400') : 'text-stone-300'}">
          ${r.grossMargin !== null ? r.grossMargin.toFixed(1)+'%' : '—'}
        </span>
        ${r.gmImproveStreak >= 3 ? '<span class="text-teal-500 ml-0.5">↑</span>' : ''}
      </td>
      <td class="px-3 py-2 text-xs text-stone-500">
        ${r.signalScore >= 25 ? `${r.signalQ ?? '—'}<br>${signalFlagStr(r.signalFlags)}` : '<span class="text-stone-300">—</span>'}
      </td>
      <td class="px-3 py-2 text-right font-bold text-stone-800">
        ${r.price ? '$' + r.price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '<span class="text-stone-300">—</span>'}
        ${r.chg1d !== null && r.chg1d !== undefined ? `<span class="text-xs ml-1 ${r.chg1d >= 0 ? 'text-emerald-500' : 'text-red-500'}">${r.chg1d >= 0 ? '+' : ''}${r.chg1d.toFixed(1)}%</span>` : ''}
      </td>
      <td class="px-3 py-2 text-right">${fmtMktcap(r.mktcap)}</td>
    </tr>
  `).join('');

  // ソートヘッダー更新
  document.querySelectorAll('th.sortable').forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
    if (th.dataset.col === sortCol) th.classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
  });
}

// ── ソートクリック ────────────────────────────────
document.querySelectorAll('th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    if (sortCol === th.dataset.col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortCol = th.dataset.col; sortDir = 'desc'; }
    renderTable();
  });
});

// ── 分析アプリを開く ──────────────────────────────
function openAnalysis(ticker) {
  window.open(`/?ticker=${ticker}`, '_blank');
}

// ── CSV エクスポート ──────────────────────────────
function exportCsv() {
  const rows = getFilteredSorted();
  const header = 'Ticker,名称,フェーズ,シグナル確度,RoF40,OpM%,YoY%,粗利率%,シグナルQ,株価,時価総額B\n';
  const body = rows.map(r => [
    r.ticker,
    '"' + (r.name ?? '').replace(/"/g, '""') + '"',
    r.phase,
    r.signalScore,
    r.rof40 ?? '',
    r.opMargin ?? '',
    r.revYoY ?? '',
    r.grossMargin ?? '',
    r.signalQ ?? '',
    r.price ?? '',
    r.mktcap ? (r.mktcap / 1e9).toFixed(1) : '',
  ].join(',')).join('\n');
  const blob = new Blob(['﻿' + header + body], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `screener_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

// ── URL パラメータでティッカー自動入力 ──────────
const urlTicker = new URLSearchParams(location.search).get('ticker');
if (urlTicker) {
  document.getElementById('tickerInput')?.value === undefined;
}
</script>
</body>
