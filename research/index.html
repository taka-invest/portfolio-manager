<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
  body { font-family: 'Noto Sans JP', sans-serif; }
  .gradient-bg { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }

<script>
// ── クイックボタン ────────────────────────────────
const TICKERS = ['PLTR','APP','NVDA','AMD','MU','QCOM','MNDY','TTD','RKLB','NVO'];
const qb = document.getElementById('quickBtns');
TICKERS.forEach(t => {
  const btn = document.createElement('button');
  btn.id = `qbtn_${t}`;
  btn.textContent = t;
  btn.className = 'text-xs bg-white/5 hover:bg-white/15 border border-white/10 rounded-lg px-3 py-1.5 transition-all';
  btn.onclick = () => { document.getElementById('tickerInput').value = t; analyze(); };
  qb.appendChild(btn);
});

document.getElementById('tickerInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') analyze();
});

// ── localStorage キャッシュ ───────────────────────
const CACHE_KEY = t => `masya_v2_${t}`;
const CACHE_TTL = 6 * 60 * 60 * 1000; // 6時間

function saveCache(ticker, data) {
  try {
    localStorage.setItem(CACHE_KEY(ticker), JSON.stringify({
      ts: Date.now(),
      accession: data.filings?.['10-Q']?.accession ?? '',
      data,
    }));
  } catch(e) {}
}

function loadCache(ticker) {
  try {
    const raw = localStorage.getItem(CACHE_KEY(ticker));
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

function showCacheBar(ticker, cached) {
  const bar = document.getElementById('cacheBar');
  const info = document.getElementById('cacheInfo');
  if (!cached) { bar.classList.add('hidden'); return; }
  const age = Math.round((Date.now() - cached.ts) / 60000);
  const ageStr = age < 60 ? `${age}分前` : `${Math.round(age/60)}時間前`;
  info.textContent = `📦 キャッシュ表示（${ageStr}取得）`;
  bar.classList.remove('hidden');
}

// ── メイン分析関数 ────────────────────────────────
async function analyze(forceRefresh = false) {
  const ticker = document.getElementById('tickerInput').value.trim().toUpperCase();
  if (!ticker) return;

  document.getElementById('result').classList.add('hidden');
  document.getElementById('errorBox').classList.add('hidden');
  document.getElementById('cacheBar').classList.add('hidden');

  // キャッシュチェック（forceRefresh=falseかつTTL内なら使用）
  if (!forceRefresh) {
    const cached = loadCache(ticker);
    if (cached && (Date.now() - cached.ts) < CACHE_TTL) {
      renderResult(cached.data, false);
      showCacheBar(ticker, cached);
      return;
    }
  }

  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('loadingText').textContent = `${ticker} のデータをSEC EDGARから取得中...`;

  try {
    const res = await fetch(`/.netlify/functions/analyze?ticker=${ticker}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error ?? 'エラーが発生しました');

    // 新着決算チェック
    const cached = loadCache(ticker);
    const isNew = cached && cached.accession && data.filings?.['10-Q']?.accession !== cached.accession;

    saveCache(ticker, data);
    renderResult(data, isNew);
    showCacheBar(ticker, loadCache(ticker));
  } catch (e) {
    document.getElementById('errorBox').textContent = `⚠️ ${e.message}`;
    document.getElementById('errorBox').classList.remove('hidden');
  } finally {
    document.getElementById('loading').classList.add('hidden');
  }
}

// ── フォーマット関数 ──────────────────────────────
function fmtM(v) {
  if (v === null || v === undefined) return '<span class="text-white/30">N/A</span>';
  return `$${Number(v).toLocaleString('en-US', {maximumFractionDigits: 1})}M`;
}
function fmtP(v) {
  if (v === null || v === undefined) return '<span class="text-white/30">N/A</span>';
  return `$${Number(v).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
}
function fmtPct(v, colored = true) {
  if (v === null || v === undefined) return '<span class="text-white/30">—</span>';
  const c = colored ? (v >= 0 ? 'text-emerald-400' : 'text-red-400') : 'text-white/70';
  return `<span class="${c}">${v >= 0 ? '+' : ''}${v.toFixed(1)}%</span>`;
}
function fmtCostRatio(v) {
  if (v === null || v === undefined) return '<span class="text-white/30">—</span>';
  const pct = (v * 100).toFixed(1) + '%';
  // マシャ5段階評価
  const c = v < 0.15 ? 'text-yellow-200 font-bold' : v < 0.20 ? 'text-emerald-200' : v < 0.30 ? 'text-emerald-300' : v < 0.50 ? 'text-emerald-400' : v < 0.70 ? 'text-orange-400' : 'text-red-400';
  const tag = v < 0.15 ? '🏆' : v < 0.20 ? '✨' : v < 0.30 ? '✅' : '';
  return `<span class="${c}">${tag}${pct}</span>`;
}
function fmtOpMargin(v) {
  if (v === null || v === undefined) return '<span class="text-white/30">—</span>';
  const c = v > 20 ? 'text-emerald-300' : v > 10 ? 'text-emerald-400' : v > 0 ? 'text-yellow-400' : 'text-red-400';
  return `<span class="${c}">${v.toFixed(1)}%</span>`;
}
function colorGrade(c) {
  const map = { green:'text-emerald-400', yellow:'text-yellow-400', orange:'text-orange-400', red:'text-red-400', gray:'text-white/40' };
  return map[c] ?? 'text-white';
}
function verdictBg(c) {
  const map = { green:'bg-emerald-500/20 border-emerald-500/40', blue:'bg-blue-500/20 border-blue-500/40', yellow:'bg-yellow-500/20 border-yellow-500/40', red:'bg-red-500/20 border-red-500/40' };
  return map[c] ?? 'bg-white/10 border-white/20';
}
function toggleFormula(id) {
  // 他の計算式パネルを閉じてから対象を開閉
  ['formula-accounting','formula-potential','formula-leverage'].forEach(fid => {
    const el = document.getElementById(fid);
    if (!el) return;
    if (fid === id) {
      el.classList.toggle('hidden');
    } else {
      el.classList.add('hidden');
    }
  });
}

function badge(text, color) {
  const map = { emerald:'bg-emerald-500/20 text-emerald-400 border-emerald-500/30', yellow:'bg-yellow-500/20 text-yellow-400 border-yellow-500/30', red:'bg-red-500/20 text-red-400 border-red-500/30' };
  return `<span class="text-xs border rounded-full px-3 py-1 ${map[color]}">${text}</span>`;
}

// ── SVGスパークライン ─────────────────────────────
function sparkline(valuesNewestFirst, opts = {}) {
  // invert: true = 下降トレンドが「良い」（原価率など）
  const { w = 120, h = 36, color = null, showZero = false, invert = false } = opts;
  // 時系列順（左=古い、右=新しい）に並べ直す
  const values = [...valuesNewestFirst].reverse();
  const valid = values.filter(v => v !== null && v !== undefined && !isNaN(v));
  if (valid.length < 2) return '<span class="text-white/20 text-xs">データ不足</span>';

  const min = Math.min(...valid);
  const max = Math.max(...valid);
  const range = Math.max(max - min, 0.01);
  const pad = 3;

  const pts = values.map((v, i) => {
    if (v === null || v === undefined) return null;
    const x = pad + (i / (values.length - 1)) * (w - pad * 2);
    const y = pad + ((max - v) / range) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).filter(Boolean).join(' ');

  // 最新値と最古値でトレンド色を決定
  const first = valid[0], last = valid[valid.length - 1];
  const rawTrending = last >= first;
  // invert=true（原価率など）は下降が良い → 下降=緑
  const isGood = invert ? !rawTrending : rawTrending;
  const lineColor = color ?? (isGood ? '#34d399' : '#f87171');

  // ゼロライン（営業利益率用）
  let zeroLine = '';
  if (showZero && min < 0 && max > 0) {
    const zy = pad + (max / range) * (h - pad * 2);
    zeroLine = `<line x1="${pad}" y1="${zy.toFixed(1)}" x2="${w - pad}" y2="${zy.toFixed(1)}" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" stroke-dasharray="2,2"/>`;
  }

  return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;height:${h}px;display:block">
    ${zeroLine}
    <polyline points="${pts}" fill="none" stroke="${lineColor}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts.split(' ').pop().split(',')[0]}" cy="${pts.split(' ').pop().split(',')[1]}" r="2.5" fill="${lineColor}"/>
  </svg>`;
}

// ── フォーマット: OpLeverage ────────────────────
function fmtOpLev(v) {
  if (v === null || v === undefined) return '<span class="text-white/20">—</span>';
  if (v >= 3.0)  return `<span class="text-emerald-300 font-bold">${v.toFixed(1)}x</span>`;
  if (v >= 2.0)  return `<span class="text-emerald-400">${v.toFixed(1)}x</span>`;
  if (v >= 1.0)  return `<span class="text-white/60">${v.toFixed(1)}x</span>`;
  if (v >= 0)    return `<span class="text-white/30">${v.toFixed(1)}x</span>`;
  return `<span class="text-red-400">${v.toFixed(1)}x</span>`;
}

// ── フォーマット: RoF40 ──────────────────────────
function fmtRoF40(v) {
  if (v === null || v === undefined) return '<span class="text-white/20">—</span>';
  if (v >= 100) return `<span class="text-yellow-200 font-black">${v.toFixed(0)}</span>`;
  if (v >= 80)  return `<span class="text-emerald-200 font-bold">${v.toFixed(0)}</span>`;
  if (v >= 60)  return `<span class="text-emerald-300 font-bold">${v.toFixed(0)}</span>`;
  if (v >= 40)  return `<span class="text-emerald-400">${v.toFixed(0)}</span>`;
  if (v >= 20)  return `<span class="text-yellow-400">${v.toFixed(0)}</span>`;
  return `<span class="text-white/30">${v.toFixed(0)}</span>`;
}

// ── YoY加速矢印 ─────────────────────────────────
function yoyArrow(accel) {
  if (accel === null || accel === undefined) return '';
  if (accel >= 15)  return '<span class="text-emerald-300 ml-0.5">↑↑</span>';
  if (accel >= 5)   return '<span class="text-emerald-400 ml-0.5">↑</span>';
  if (accel <= -15) return '<span class="text-red-400 ml-0.5">↓↓</span>';
  if (accel <= -5)  return '<span class="text-orange-400 ml-0.5">↓</span>';
  return '<span class="text-white/20 ml-0.5">→</span>';
}

// ── シグナル確度スコア表示 ───────────────────────
function fmtSignalScore(score) {
  if (!score || score < 25) return '';
  if (score >= 75) return `<span class="text-xs font-black text-red-300 bg-red-500/20 border border-red-500/40 rounded-full px-2 py-0.5">🚨 ${score}%</span>`;
  if (score >= 50) return `<span class="text-xs font-bold text-orange-300 bg-orange-500/15 border border-orange-500/30 rounded-full px-2 py-0.5">⚡ ${score}%</span>`;
  return `<span class="text-xs text-white/30 bg-white/5 border border-white/10 rounded-full px-2 py-0.5">📌 ${score}%</span>`;
}

// ── 参入シグナルバッジ（確度スコア統合版）────────
function signalBadge(q) {
  if (!q.signals) return '';
  const s     = q.signals;
  const score = q.signalScore ?? 0;

  // 確度25%未満は表示しない（ノイズ抑制）
  if (score < 25) return '';

  const badges = [];
  if (s.redToBlack)     badges.push('<span class="bg-purple-500/30 text-purple-300 border border-purple-500/40 text-xs rounded px-1.5 py-0.5">🔄黒字化</span>');
  if (s.opMInflection)  badges.push('<span class="bg-orange-500/30 text-orange-300 border border-orange-500/40 text-xs rounded px-1.5 py-0.5">⚡OpM+</span>');
  if (s.rof40Cross40)   badges.push('<span class="bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 text-xs rounded px-1.5 py-0.5">RoF≥40</span>');
  if (s.rof40Cross60)   badges.push('<span class="bg-emerald-400/30 text-emerald-200 border border-emerald-400/40 text-xs rounded px-1.5 py-0.5">RoF≥60</span>');
  if (s.rof40Cross80)   badges.push('<span class="bg-yellow-400/30 text-yellow-200 border border-yellow-400/40 text-xs rounded px-1.5 py-0.5">RoF≥80</span>');
  if (s.opLevHigh)      badges.push('<span class="bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 text-xs rounded px-1.5 py-0.5">高レバ</span>');
  if (q.grMarginSignal) badges.push('<span class="bg-teal-500/30 text-teal-300 border border-teal-500/40 text-xs rounded px-1.5 py-0.5">粗利↑</span>');

  const scoreHtml = fmtSignalScore(score);
  return `<div class="flex gap-1 flex-wrap mt-1 items-center">${scoreHtml}${badges.join('')}</div>`;
}

// ── 参入シグナルの行背景色（signalScore基準）───────
function rowBg(q, isLatest) {
  if (isLatest) return 'bg-indigo-500/5';
  const score = q.signalScore ?? 0;
  if (score >= 75) return 'bg-red-500/8';
  if (score >= 50) return 'bg-orange-500/5';
  if (score >= 25) return 'bg-white/2';
  return '';
}

// ── トレンドセクション描画 ────────────────────────
// ── 予想四半期（コンセンサス・自分の想定）─────────────
// 実績とは混ぜない。判定ルールは実績と同じ（research/forecast.js の enrich）。
let pmTrendData = null;
const pmEsc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const pmMoney = m => m == null ? '—' : (Math.abs(m) >= 1000 ? '$' + (m / 1000).toFixed(2) + 'B' : '$' + m.toFixed(0) + 'M');
function pmStorage() { try { return window.localStorage; } catch { return null; } }

function pmForecastRows(trend, d) {
  const F = window.PMForecast, rows = [];
  if (!F || !trend?.length) return rows;
  const next = d?.outlook?.next;
  if (next?.revenueEstimateM != null) {
    const end = F.consensusQuarter(trend, next);
    if (end) rows.push(F.forecastRow(trend, { end, revM: next.revenueEstimateM, epsQ: next.epsEstimate, kind: 'consensus', source: 'コンセンサス' }));
  }
  const st = pmStorage();
  const own = st && d?.ticker ? F.readOwn(st, d.ticker) : null;
  const ownRev = own ? F.ownRevenue(trend, own) : null;
  if (ownRev != null) rows.push(F.forecastRow(trend, { revM: ownRev, opMargin: own.opMargin, kind: 'own', source: '自分の想定' }));
  return rows.filter(Boolean);
}

function pmForecastRowHtml(q, trend) {
  const ago = window.PMForecast.yearAgo(trend, q.end);
  const opmYoY = q.opMargin != null && ago?.opMargin != null ? q.opMargin - ago.opMargin : null;
  const badge = q.kind === 'own'
    ? '<span class="text-[10px] rounded px-1 py-0.5 bg-sky-500/20 text-sky-300 border border-sky-500/30">自分の想定</span>'
    : '<span class="text-[10px] rounded px-1 py-0.5 bg-violet-500/20 text-violet-300 border border-violet-500/30">コンセンサス</span>';
  const dash = '<span class="text-white/20">—</span>';
  return `
    <tr class="pm-forecast-row border-b border-dashed border-white/15 bg-white/[0.03] italic" data-kind="${q.kind}">
      <td class="px-2 py-2 text-xs whitespace-nowrap min-w-[110px]">
        <div class="font-bold text-white/60">${q.label}（予）</div>
        <div class="mt-0.5">${badge}</div>
        ${signalBadge(q)}
      </td>
      <td class="px-2 py-2 text-xs text-right text-white/60 whitespace-nowrap">${pmMoney(q.revM)}</td>
      <td class="px-2 py-2 text-xs text-right whitespace-nowrap">${q.revYoY != null ? fmtPct(q.revYoY) + yoyArrow(q.yoyAccel) : dash}</td>
      <td class="px-2 py-2 text-xs text-right">${q.revQoQ != null ? fmtPct(q.revQoQ) : dash}</td>
      <td class="px-2 py-2 text-xs text-right">${dash}</td>
      <td class="px-2 py-2 text-xs text-right whitespace-nowrap">${q.opMargin != null ? fmtOpMargin(q.opMargin) : dash}</td>
      <td class="px-2 py-2 text-xs text-right whitespace-nowrap">${opmYoY != null ? `<span class="text-white/50">${opmYoY > 0 ? '+' : ''}${opmYoY.toFixed(1)}pp</span>` : dash}</td>
      <td class="px-2 py-2 text-xs text-right">${q.opLeverage != null ? fmtOpLev(q.opLeverage) : dash}</td>
      <td class="px-2 py-2 text-xs text-right">${q.rof40 != null ? fmtRoF40(q.rof40) : dash}</td>
      <td class="px-2 py-2 text-xs text-right whitespace-nowrap text-white/60">${q.opM != null ? pmMoney(q.opM) : dash}</td>
      <td class="px-2 py-2 text-xs text-right whitespace-nowrap">${q.epsQ != null ? `<span class="text-white/60 font-mono">${q.epsQ >= 0 ? '+' : ''}${q.epsQ.toFixed(2)}</span>` : dash}</td>
      <td class="px-2 py-2 text-xs text-right whitespace-nowrap"><span class="text-white/50" title="予想値で計算した試算">${q.opMargin != null ? q.signalScore : dash}</span></td>
    </tr>`;
}

function pmForecastPanel(trend, d, rows) {
  const F = window.PMForecast;
  const o = d?.outlook || {};
  const n = o.next;
  const hour = { bmo: '寄り前', amc: '引け後', dmh: '取引時間中' }[n?.hour] || '';
  const fmtTime = iso => { try { return new Date(iso).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return ''; } };
  let head;
  if (!d?.outlook) head = `<p class="text-xs text-white/40">アナリスト予想：サーバーが未対応のため未取得です（自分の想定は入力できます）</p>`;
  else if (o.unavailable) head = `<p class="text-xs text-white/40">アナリスト予想：${pmEsc(o.unavailable)}（自分の想定は入力できます）</p>`;
  else if (!n) head = `<p class="text-xs text-white/40">次回決算の予定が見つかりません${o.error ? '（' + pmEsc(o.error) + '）' : ''}。</p>`;
  else {
    const matched = n.revenueEstimateM != null && F.consensusQuarter(trend, n);
    head = `<p class="text-xs text-white/70">次回決算 <span class="font-bold text-white">${pmEsc(n.date)}</span>${hour ? '（' + hour + '）' : ''}${n.fiscalYear && n.fiscalQuarter ? `・会社の会計年度 FY${n.fiscalYear} Q${n.fiscalQuarter}` : ''}
      ／コンセンサス 売上 <span class="font-bold">${pmMoney(n.revenueEstimateM)}</span>・EPS <span class="font-bold">${n.epsEstimate != null ? '$' + n.epsEstimate.toFixed(2) : '—'}</span></p>
      <p class="text-[11px] text-white/30">${pmEsc(o.source?.provider || '')}・取得 ${o.source?.retrievedAt ? fmtTime(o.source.retrievedAt) : ''}${matched ? '' : '。対象四半期を実績の次の四半期と確認できないため、予想行には入れていません'}${o.error ? '（' + pmEsc(o.error) + '）' : ''}</p>`;
  }
  const hist = (o.epsHistory || []).map(h => `<span class="mr-3">${pmEsc(window.PMForecast.quarterLabel(h.period))} ${h.surprisePct != null ? `<span class="${h.surprisePct >= 0 ? 'text-emerald-400' : 'text-red-400'}">${h.surprisePct >= 0 ? '+' : ''}${h.surprisePct.toFixed(1)}%</span>` : '—'}</span>`).join('');
  const st = pmStorage();
  const own = st && d?.ticker ? F.readOwn(st, d.ticker) : null;
  const latestOpM = trend[0]?.opMargin;
  const ownRow = rows.find(r => r.kind === 'own');
  const flags = ownRow ? Object.entries({ redToBlack: '黒字化', opMInflection: 'OpM急拡大', rof40Cross40: 'RoF40突破', rof40Cross60: 'RoF60突破', rof40Cross80: 'RoF80突破', opLevHigh: '高レバ', yoyAccelStrong: 'YoY加速' }).filter(([k]) => ownRow.signals?.[k]).map(([, v]) => v) : [];
  return `
  <div class="mt-4 rounded-xl border border-white/10 bg-white/[0.03] p-3" id="pm-forecast-panel">
    <div class="text-xs font-bold text-white/60 mb-1">🔮 次の四半期の予想（参考）</div>
    ${head}
    ${hist ? `<p class="text-[11px] text-white/40 mt-1">EPSサプライズ（実績÷予想）：${hist}</p>` : ''}
    <div class="mt-3 flex flex-wrap items-end gap-2 text-xs">
      <label class="text-white/50">売上（$M）<input id="pm-own-rev" type="number" step="any" class="block w-24 mt-0.5 rounded bg-white/10 px-2 py-1 text-white" value="${own?.revM ?? ''}"></label>
      <span class="text-white/30 pb-1">または</span>
      <label class="text-white/50">前年比（%）<input id="pm-own-yoy" type="number" step="any" class="block w-20 mt-0.5 rounded bg-white/10 px-2 py-1 text-white" value="${own?.revYoY ?? ''}"></label>
      <label class="text-white/50">営業利益率（%）<input id="pm-own-opm" type="number" step="any" class="block w-20 mt-0.5 rounded bg-white/10 px-2 py-1 text-white" value="${own?.opMargin ?? ''}"></label>
      <button type="button" class="rounded bg-sky-500/20 border border-sky-500/40 text-sky-200 px-3 py-1.5" onclick="pmOwnSave()">自分の想定を反映</button>
      ${latestOpM != null ? `<button type="button" class="rounded bg-white/5 border border-white/15 text-white/60 px-2 py-1.5" onclick="document.getElementById('pm-own-opm').value='${latestOpM.toFixed(1)}'">直近の利益率（${latestOpM.toFixed(1)}%）</button>` : ''}
      ${own ? '<button type="button" class="rounded bg-white/5 border border-white/15 text-white/50 px-2 py-1.5" onclick="pmOwnClear()">消去</button>' : ''}
    </div>
    ${ownRow ? `<p class="text-xs mt-2 text-white/70" id="pm-own-result">この想定どおりなら：前年比 ${ownRow.revYoY != null ? ownRow.revYoY.toFixed(1) + '%' : '—'}・RoF40 ${ownRow.rof40 != null ? ownRow.rof40.toFixed(0) : '—（営業利益率が必要）'}・シグナル ${ownRow.opMargin != null ? (flags.length ? flags.join('・') + `（スコア試算 ${ownRow.signalScore}）` : 'なし') : '—（営業利益率が必要）'}</p>` : ''}
    <p class="text-[11px] text-white/30 mt-1">予想は実績と分けて点線・斜体で表示します。コンセンサスは売上・EPSのみのため、利益率・RoF40・スコアは自分の想定でのみ試算します。自分の想定はこのブラウザーにだけ保存されます。</p>
  </div>`;
}

function pmRerenderTrend() {
  const wrap = document.getElementById('pm-trend-wrap');
  if (wrap && pmTrendData) wrap.innerHTML = renderTrendSection(pmTrendData.trend, pmTrendData);
}
function pmOwnSave() {
  const val = id => { const v = document.getElementById(id).value.trim(); return v === '' ? null : Number(v); };
  const own = { revM: val('pm-own-rev'), revYoY: val('pm-own-yoy'), opMargin: val('pm-own-opm') };
  const bad = Object.values(own).some(v => v !== null && !Number.isFinite(v));
  if (bad || (own.revM == null && own.revYoY == null)) { alert('売上（$M）か前年比（%）を数値で入力してください。'); return; }
  if (own.revM != null && own.revM <= 0) { alert('売上は正の数で入力してください。'); return; }
  const st = pmStorage();
  if (st && pmTrendData?.ticker) window.PMForecast.saveOwn(st, pmTrendData.ticker, own);
  pmRerenderTrend();
}
function pmOwnClear() {
  const st = pmStorage();
  if (st && pmTrendData?.ticker) window.PMForecast.saveOwn(st, pmTrendData.ticker, null);
  pmRerenderTrend();
}

function renderTrendSection(trend, d) {

  if (d) pmTrendData = d;
  const forecastRows = pmForecastRows(trend, d);

  const dispTrend = trend.slice(0, 12); // 最大12四半期表示
  const revData  = trend.map(q => q.revM);
  const costData = trend.map(q => q.costRatio ? q.costRatio * 100 : null);
  const opMgData = trend.map(q => q.opMargin);
  const rof40Data = trend.map(q => q.rof40);

  // 転換点の強調表示ラベル
  const inflectionCount = dispTrend.filter(q => q.inflectionLevel === 'inflection').length;

  const rows = dispTrend.map((q, i) => {
    const isLatest = i === 0;
    const score = q.signalScore ?? 0;
    const qLabel = isLatest ? `🔵 ${q.label}` : score >= 75 ? `🚨 ${q.label}` : score >= 50 ? `⚡ ${q.label}` : q.label;

    return `
    <tr class="trend-row border-b border-white/5 ${rowBg(q, isLatest)}">

        ${signalBadge(q)}
      </td>
      <td class="px-2 py-2 text-xs text-right text-white/80 whitespace-nowrap">${q.revM >= 1000 ? '$'+(q.revM/1000).toFixed(1)+'B' : '$'+q.revM.toFixed(0)+'M'}</td>
      <td class="px-2 py-2 text-xs text-right whitespace-nowrap">${fmtPct(q.revYoY)}${yoyArrow(q.yoyAccel)}</td>
      <td class="px-2 py-2 text-xs text-right">${fmtPct(q.revQoQ)}</td>
      <td class="px-2 py-2 text-xs text-right">${fmtCostRatio(q.costRatio)}</td>
      <td class="px-2 py-2 text-xs text-right whitespace-nowrap">${fmtOpMargin(q.opMargin)}${q.opMDelta != null ? `<span class="text-white/25 text-xs ml-1">(${q.opMDelta > 0 ? '+' : ''}${q.opMDelta?.toFixed(1)})</span>` : ''}</td>
      <td class="px-2 py-2 text-xs text-right whitespace-nowrap">${(() => { const prev4opM = trend[i + 4]?.opMargin ?? null; const yoy = (q.opMargin != null && prev4opM != null) ? q.opMargin - prev4opM : null; if (yoy == null) return '<span class="text-white/20">—</span>'; const color = yoy > 3 ? 'text-emerald-400' : yoy < -3 ? 'text-red-400' : 'text-white/40'; return `<span class="${color} font-bold">${yoy > 0 ? '+' : ''}${yoy.toFixed(1)}pp</span>`; })()}</td>
      <td class="px-2 py-2 text-xs text-right">${fmtOpLev(q.opLeverage)}</td>
      <td class="px-2 py-2 text-xs text-right">${fmtRoF40(q.rof40)}</td>
      <td class="px-2 py-2 text-xs text-right whitespace-nowrap">
        ${q.opM != null ? `<span class="${q.opM >= 0 ? 'text-emerald-400' : 'text-red-400'}">${Math.abs(q.opM) >= 1000 ? '$'+(q.opM/1000).toFixed(1)+'B' : '$'+q.opM.toFixed(0)+'M'}</span>` : '<span class="text-white/30">—</span>'}
        ${(() => { const p = trend[i+4]?.opM ?? null; if (q.opM == null || p == null || p === 0) return ''; if (p < 0 && q.opM > 0) return '<span class="text-yellow-300 text-[10px] ml-1">黒転</span>'; const yoy = (q.opM - p) / Math.abs(p) * 100; const c = yoy > 20 ? 'text-emerald-300' : yoy > 0 ? 'text-emerald-500/70' : 'text-red-400'; return `<span class="${c} text-[10px] ml-1">${yoy > 0 ? '+' : ''}${yoy.toFixed(0)}%</span>`; })()}
      </td>
      <td class="px-2 py-2 text-xs text-right whitespace-nowrap">
        ${q.epsQ != null
          ? `<span class="${q.epsQ >= 0 ? 'text-emerald-400' : 'text-red-400'} font-mono">${q.epsQ >= 0 ? '+' : ''}${q.epsQ.toFixed(2)}</span>${q.epsYoY != null ? `<span class="text-white/25 ml-1">(${q.epsYoY >= 0 ? '+' : ''}${q.epsYoY.toFixed(2)})</span>` : ''}`
          : '<span class="text-white/20">—</span>'}
      </td>
      <td class="px-2 py-2 text-xs text-right whitespace-nowrap">
        ${score >= 70
          ? `<span class="inline-flex items-center justify-center w-9 h-5 rounded text-xs font-bold bg-red-500/20 text-red-300">${score}</span>`
          : score >= 60
          ? `<span class="inline-flex items-center justify-center w-9 h-5 rounded text-xs font-bold bg-orange-500/15 text-orange-300">${score}</span>`
          : score >= 40

  return `

    <span>Score: <span class="text-red-300">70+</span>=高確度 / <span class="text-orange-300">60+</span>=有望 / 〜59=参考値</span>

  <div class="overflow-x-auto">

      <thead>

          <th class="px-2 py-1.5 text-right text-xs text-white/40 font-normal">OpLev</th>

        </tr>
      </thead>
      <tbody>${forecastRows.map(q => pmForecastRowHtml(q, trend)).join('')}${rows}</tbody>
    </table>
  </div>
  ${pmForecastPanel(trend, d, forecastRows)}

</div>`;
}

// ── トレンド自動解釈（強化版） ────────────────────
function trendInsight(trend) {
  if (trend.length < 3) return '';
  const latest = trend[0];
  const msgs = [];

  // 参入シグナル検知済み四半期を抽出
  const inflectionQs = trend.filter(q => q.inflectionLevel === 'inflection');
  if (inflectionQs.length > 0) {
    const q = inflectionQs[inflectionQs.length - 1]; // 最古のシグナル（最初の転換点）
    const badges = [];
    if (q.signals?.redToBlack)    badges.push('赤字→黒字転換');
    if (q.signals?.opMInflection) badges.push(`OpM急拡大(+${q.opMDelta?.toFixed(1)}pp)`);
    if (q.signals?.rof40Cross40)  badges.push('RoF40初突破');
    msgs.push({ icon: '🚨', text: `【参入シグナル検知】${q.label} — ${badges.join(' / ')} （この四半期以降が理論上の参入ゾーン）`, c: 'text-orange-300 font-bold' });
  }

  // 直近YoY加速/減速
  if (latest.revYoY !== null && trend[1]?.revYoY !== null) {
    const accel = latest.revYoY - trend[1].revYoY;
    if (accel > 5)       msgs.push({ icon: '🚀', text: `売上成長が加速中（YoY: ${latest.revYoY.toFixed(1)}%、前期比+${accel.toFixed(1)}pts）`, c: 'text-emerald-400' });
    else if (accel < -5) msgs.push({ icon: '⚠️', text: `売上成長が減速中（YoY: ${latest.revYoY.toFixed(1)}%、前期比${accel.toFixed(1)}pts）`, c: 'text-yellow-400' });
  }

  // 原価率改善
  const costTrend = trend.slice(0, 5).filter(q => q.costRatio != null);
  if (costTrend.length >= 3) {
    const oldest = costTrend[costTrend.length - 1].costRatio;
    const newest = costTrend[0].costRatio;
    const delta = (newest - oldest) * 100;
    if (delta < -3)     msgs.push({ icon: '✅', text: `原価率が構造的に改善（${(oldest*100).toFixed(1)}% → ${(newest*100).toFixed(1)}%）`, c: 'text-emerald-400' });
    else if (delta > 3) msgs.push({ icon: '🔶', text: `原価率が悪化傾向（${(oldest*100).toFixed(1)}% → ${(newest*100).toFixed(1)}%）`, c: 'text-orange-400' });
  }

  // 最新RoF40水準
  if (latest.rof40 !== null) {
    if      (latest.rof40 >= 100) msgs.push({ icon: '💎', text: `RoF40スコア ${latest.rof40.toFixed(0)} — 世界最高水準の成長×収益性`, c: 'text-yellow-200 font-bold' });
    else if (latest.rof40 >= 80)  msgs.push({ icon: '🌟', text: `RoF40スコア ${latest.rof40.toFixed(0)} — 超高クオリティ成長株`, c: 'text-emerald-200 font-bold' });
    else if (latest.rof40 >= 60)  msgs.push({ icon: '⭐', text: `RoF40スコア ${latest.rof40.toFixed(0)} — 高クオリティ成長株`, c: 'text-emerald-300' });
    else if (latest.rof40 >= 40)  msgs.push({ icon: '✅', text: `RoF40スコア ${latest.rof40.toFixed(0)} — Rule of 40クリア`, c: 'text-emerald-400' });
    else if (latest.rof40 !== null) msgs.push({ icon: '📊', text: `RoF40スコア ${latest.rof40.toFixed(0)} — Rule of 40未達（<40）`, c: 'text-white/40' });
  }

  // 最新OpLeverage
  if (latest.opLeverage !== null && latest.opLeverage >= 2.0) {
    msgs.push({ icon: '⚡', text: `営業レバレッジ ${latest.opLeverage.toFixed(1)}x — 売上成長が営業利益に${latest.opLeverage.toFixed(1)}倍の効果`, c: latest.opLeverage >= 3 ? 'text-emerald-300' : 'text-emerald-400' });
  }

  // 営業利益率水準
  if (latest.opMargin !== null) {
    if      (latest.opMargin > 40) msgs.push({ icon: '🏆', text: `営業利益率 ${latest.opMargin.toFixed(1)}% — 世界トップクラスの収益体質`, c: 'text-emerald-300' });
    else if (latest.opMargin > 20) msgs.push({ icon: '⭐', text: `営業利益率 ${latest.opMargin.toFixed(1)}% — 超高収益体質`, c: 'text-emerald-400' });
    else if (latest.opMargin < 0)  msgs.push({ icon: '🚨', text: `営業損失が継続中（${latest.opMargin.toFixed(1)}%）`, c: 'text-red-400' });
  }

  if (msgs.length === 0) return '';
  return `<div class="mt-4 pt-3 border-t border-white/10 space-y-2">
    ${msgs.map(m => `<p class="text-xs ${m.c}">${m.icon} ${m.text}</p>`).join('')}
  </div>`;
}

// ── AI総括ナラティブ生成 ──────────────────────────
function generateNarrative(ticker, d) {
  const trend = d.trend ?? [];
  const calc  = d.calc  ?? {};
  if (trend.length < 3) return '';

  const latest  = trend[0];
  const prev    = trend[1]  ?? null;
  const prev4   = trend[4]  ?? null;
  const recent4 = trend.slice(0, 4);

  // ── トレンド計算 ──────────────────────────────
  const rof40Now   = latest.rof40;
  const rof40_4q   = prev4?.rof40 ?? null;
  const rof40Delta = (rof40Now !== null && rof40_4q !== null) ? rof40Now - rof40_4q : null;

  const opMNow   = latest.opMargin;
  const opM_4q   = prev4?.opMargin ?? null;
  const opMTrend = (opMNow !== null && opM_4q !== null) ? opMNow - opM_4q : null;

  const yoyNow  = latest.revYoY;
  const yoyPrev = prev?.revYoY ?? null;
  const yoyAccel = (yoyNow !== null && yoyPrev !== null) ? yoyNow - yoyPrev : null;

  // ── シグナル統計 ──────────────────────────────
  const latestScore     = latest.signalScore ?? 0;
  const recentHighQ     = recent4.find(q => (q.signalScore ?? 0) >= 75) ?? null;
  const allHighQs       = trend.filter(q => (q.signalScore ?? 0) >= 75);
  const bestEverScore   = trend.reduce((m, q) => Math.max(m, q.signalScore ?? 0), 0);
  const confidenceDisp  = recentHighQ ? (recentHighQ.signalScore) : (latestScore > 0 ? latestScore : null);

  // ── 総合判定ロジック ──────────────────────────
  const isRofStrong     = rof40Now !== null && rof40Now >= 60;
  const isRofImproving  = rof40Delta !== null && rof40Delta > 0;
  const isRofDeclining  = rof40Delta !== null && rof40Delta < -20;
  const isOpMDeclining  = opMTrend !== null && opMTrend < -5;
  const isOpMLoss       = opMNow !== null && opMNow < 0;
  const hasRecentHigh   = recentHighQ !== null;
  const yoyAccelerating = yoyAccel !== null && yoyAccel > 5;

  let verdict, verdictLabel, verdictColorClass, verdictBorderClass;

  if (isOpMLoss || (isRofDeclining && isOpMDeclining)) {
    verdict = 'SELL_WATCH';
    verdictLabel = '⚠️ 要注意 — 売り・利確を検討';
    verdictColorClass  = 'text-orange-300';
    verdictBorderClass = 'border-orange-500/30 bg-orange-500/5';
  } else if (hasRecentHigh && isRofStrong && (isRofImproving || yoyAccelerating)) {
    verdict = 'BUY';
    verdictLabel = '🟢 強気 — 買い・買い増し検討';
    verdictColorClass  = 'text-emerald-300';
    verdictBorderClass = 'border-emerald-500/30 bg-emerald-500/5';
  } else if (isRofStrong && !isRofDeclining) {
    verdict = 'HOLD';
    verdictLabel = '🔵 ホールド推奨 — 保有継続';
    verdictColorClass  = 'text-indigo-300';
    verdictBorderClass = 'border-indigo-500/30 bg-indigo-500/5';
  } else if (rof40Now !== null && rof40Now >= 40) {
    verdict = 'HOLD_WATCH';
    verdictLabel = '🟡 ホールド — 次Q決算で確認';
    verdictColorClass  = 'text-yellow-300';
    verdictBorderClass = 'border-yellow-500/30 bg-yellow-500/5';
  } else {
    verdict = 'WATCH';
    verdictLabel = '⚪ ウォッチ継続 — 参入条件未達';
    verdictColorClass  = 'text-white/50';
    verdictBorderClass = 'border-white/10 bg-white/3';
  }

  // ── 根拠テキスト生成 ──────────────────────────
  const grounds = [];

  if (rof40Now !== null) {
    const dirStr = rof40Delta !== null
      ? (rof40Delta > 10 ? `、4Q前比<strong class="text-emerald-300">+${rof40Delta.toFixed(0)}pt上昇</strong>` : rof40Delta < -10 ? `、4Q前比<strong class="text-orange-400">${rof40Delta.toFixed(0)}pt低下</strong>` : '') : '';
    if (rof40Now >= 100)
      grounds.push(`Rule of 40スコアは<strong class="text-yellow-200">${rof40Now.toFixed(0)}</strong>${dirStr}。NVDA・PLTRクラスの成長×収益性を同時達成しており、現成長が続く限り株価上昇の余地は構造的に存在する。`);
    else if (rof40Now >= 60)
      grounds.push(`Rule of 40スコアは<strong class="text-emerald-300">${rof40Now.toFixed(0)}</strong>${dirStr}。高クオリティ成長株の水準を維持。成長と収益性のバランスが良好。`);
    else if (rof40Now >= 40)
      grounds.push(`Rule of 40スコアは<strong class="text-emerald-400">${rof40Now.toFixed(0)}</strong>${dirStr}。SaaS業界標準の40をクリア。RoF60超を目指せるか次Qに注目。`);
    else
      grounds.push(`Rule of 40スコアは<strong class="text-yellow-400">${rof40Now.toFixed(0)}</strong>${dirStr}。基準値40を下回っており、成長加速 or 収益改善の確認が参入条件となる。`);
  }

  if (yoyNow !== null) {
    if (yoyAccel !== null && yoyAccel > 10)
      grounds.push(`売上成長率<strong class="text-emerald-300">${yoyNow.toFixed(1)}%</strong>（前Q比<strong>+${yoyAccel.toFixed(1)}pp加速</strong>）。加速局面は株価モメンタムが最も乗りやすいタイミング。決算発表翌日の参入が最も効果的。`);
    else if (yoyAccel !== null && yoyAccel < -10)
      grounds.push(`売上成長率<strong class="text-yellow-300">${yoyNow.toFixed(1)}%</strong>（前Q比<strong class="text-orange-400">${yoyAccel.toFixed(1)}pp減速</strong>）。2Q連続で確認されれば成長モメンタムが失われつつある可能性がある。`);
  }

  if (opMNow !== null) {
    if (opMTrend !== null && opMTrend > 5)
      grounds.push(`営業利益率<strong class="text-emerald-300">${opMNow.toFixed(1)}%</strong>（前年同期比+${opMTrend.toFixed(1)}pp改善）。固定費の希薄化が加速しており、スケール効果が本格化している。`);
    else if (opMNow > 35)
      grounds.push(`営業利益率<strong class="text-emerald-300">${opMNow.toFixed(1)}%</strong>は業界トップクラス。価格支配力と高い収益体質が確立されている。`);
    else if (opMNow < 0)
      grounds.push(`営業利益率<strong class="text-red-400">${opMNow.toFixed(1)}%</strong>は依然赤字。次の転換点（黒字化）が最初の参入シグナルとなる。`);
  }

  if (latest.opLeverage !== null && latest.opLeverage >= 2.5)
    grounds.push(`営業レバレッジ<strong class="text-emerald-300">${latest.opLeverage.toFixed(1)}x</strong> — 売上1%増に対し営業利益が${latest.opLeverage.toFixed(1)}%増加。スケールビジネスが確実に軌道に乗っている。`);

  // マシャ基準コメント追加
  const mg = calc.masyaCostGrade;
  const cr = latest.costRatio;
  if (mg && cr !== null) {
    if (mg.level >= 5)
      grounds.push(`原価率<strong class="text-yellow-300">${(cr*100).toFixed(1)}%</strong>はマシャ塾の「<strong>最強・化け物級</strong>」水準（＜15%）。在庫を持たないソフトウェア的ビジネスモデルで、利益の大半が本業から生まれている。`);
    else if (mg.level >= 4)
      grounds.push(`原価率<strong class="text-emerald-300">${(cr*100).toFixed(1)}%</strong>はマシャ塾「優秀」水準（＜20%）。AIテック・SaaS企業として極めて高い利益体質。`);
    else if (mg.level >= 3)
      grounds.push(`原価率<strong class="text-emerald-400">${(cr*100).toFixed(1)}%</strong>はマシャ塾「良」水準（＜30%）。競合優位性と高い価格支配力を示している。`);
    else if (mg.level >= 2)
      grounds.push(`原価率<strong class="text-yellow-400">${(cr*100).toFixed(1)}%</strong>はバフェット基準（＜50%）クリア。キャッシュリッチ条件の一つを満たす。`);
    else if (cr > 0.70)
      grounds.push(`原価率<strong class="text-orange-400">${(cr*100).toFixed(1)}%</strong>は高水準。マシャ塾基準では「要注意」ゾーン。コスト削減と粗利改善が鍵。`);
  }
  if (calc.isCashRich)
    grounds.push(`<strong class="text-emerald-200">💰 キャッシュリッチ候補</strong> — 原価率＜50%かつ営業利益成長の2条件を同時達成。マシャ塾が最も重視する「本業で稼げるビジネス」の証明。`);
  else if (calc.cashRichCond1 && !calc.cashRichCond2)
    grounds.push(`キャッシュリッチ条件1（原価率＜50%）はクリア。条件2の「営業利益成長」達成が次のカタリスト。`);

  if (allHighQs.length > 0) {
    const firstHigh = allHighQs[allHighQs.length - 1]; // 最古の高スコアQ
    grounds.push(`高確度シグナル（確度≥75%）の最初の発生は<strong class="text-white/80">${firstHigh.label}</strong>（確度${firstHigh.signalScore}%）。この時点での参入検討が理論上のベストタイミングだった。`);
  }

  // ── リスク要因 ────────────────────────────────
  const risks = [];
  if (isRofDeclining)  risks.push(`RoF40が4Q前比${rof40Delta?.toFixed(0)}ptと低下傾向 — 成長または収益性のどちらかが鈍化している`);
  if (isOpMDeclining)  risks.push(`営業利益率が前年同期比${opMTrend?.toFixed(1)}pp悪化 — コスト増加が収益を圧迫している可能性`);
  if (yoyAccel !== null && yoyAccel < -15) risks.push(`売上成長が${yoyAccel.toFixed(1)}ppと急減速 — 2Q連続確認なら撤退を具体的に検討`);
  if (latest.costRatio !== null && latest.costRatio > 0.70) risks.push(`原価率${(latest.costRatio*100).toFixed(1)}%は高水準 — 価格支配力の弱さに注意`);
  if (risks.length === 0 && rof40Now !== null && rof40Now < 40) risks.push('RoF40が40未達 — 参入は成長加速 or 収益改善の確認後に');
  if (risks.length === 0) risks.push('現時点で大きなリスクシグナルは検出されていない（定量データ上）');

  // ── 次Q注目ポイント ───────────────────────────
  let watchPoint = '';
  if (verdict === 'BUY') {
    const holdTarget = rof40Now !== null ? rof40Now.toFixed(0) : '—';
    watchPoint = `次QでもRoF40が<strong>${holdTarget}以上</strong>を維持し、OpMが横ばい以上なら保有継続のシグナル。RoF40が20pt以上低下した場合は利確ラインを検討。`;
  } else if (verdict === 'HOLD') {
    const upTarget = rof40Now !== null ? (rof40Now + 10).toFixed(0) : '—';
    watchPoint = `次QでRoF40が<strong>${upTarget}超</strong>に改善されれば買い増し検討のトリガー。OpM拡大 + YoY加速の2条件が揃うかに注目。`;
  } else if (verdict === 'SELL_WATCH') {
    watchPoint = `次Qで<strong>OpMのプラス転換 or 前年同期比の改善</strong>が見られるか確認。改善がなければ撤退・縮小を具体的に検討すべき。`;
  } else if (verdict === 'HOLD_WATCH') {
    watchPoint = `RoF40が次Qで<strong>60超</strong>に伸びるか注目。OpMΔ +5pp以上 + YoY加速が揃えば高確度シグナルとなる可能性がある。`;
  } else {
    watchPoint = `<strong>OpMのプラス転換</strong>、または<strong>RoF40の40突破</strong>が確認された決算翌日が参入の第一候補タイミング。`;
  }

  const scoreBar = confidenceDisp
    ? `<div class="flex items-center gap-2 mt-1">
        <div class="flex-1 bg-white/10 rounded-full h-1.5">
          <div class="h-1.5 rounded-full transition-all" style="width:${confidenceDisp}%;background:${confidenceDisp>=75?'#34d399':confidenceDisp>=50?'#fb923c':'#94a3b8'}"></div>
        </div>
        <span class="text-xs font-bold ${confidenceDisp>=75?'text-emerald-400':confidenceDisp>=50?'text-orange-400':'text-white/40'}">${confidenceDisp}%</span>
      </div>` : '';

  return `
<div class="card rounded-2xl p-6 border ${verdictBorderClass}">
  <div class="flex items-center gap-3 mb-5">
    <h2 class="text-base font-bold">🤖 AI総括アナリシス</h2>
    <span class="text-xs text-white/25 ml-auto">SEC実データ × 定量分析 | ${ticker}</span>
  </div>

  <!-- 判定バナー -->
  <div class="flex items-start justify-between gap-4 p-4 rounded-xl border ${verdictBorderClass} mb-5">
    <div>
      <div class="text-xl font-black ${verdictColorClass}">${verdictLabel}</div>
      <div class="text-xs text-white/30 mt-1">最高確度シグナル: ${bestEverScore > 0 ? bestEverScore+'%' : 'なし'} / 直近4Q内高確度シグナル: ${recentHighQ ? recentHighQ.label+'（'+recentHighQ.signalScore+'%）' : 'なし'}</div>
      ${scoreBar}
    </div>
    <div class="text-right flex-shrink-0">
      <div class="text-xs text-white/30">確度</div>
      <div class="text-3xl font-black ${verdictColorClass}">${confidenceDisp ? confidenceDisp+'%' : '—'}</div>
    </div>
  </div>

  <!-- 根拠 -->
  <div class="mb-4">
    <div class="text-xs text-white/35 font-bold uppercase tracking-wider mb-2">📊 総合根拠</div>
    <div class="space-y-2">
      ${grounds.map(g => `<p class="text-sm text-white/70 leading-relaxed">• ${g}</p>`).join('')}
    </div>
  </div>

  <!-- リスク -->
  <div class="bg-red-500/5 border border-red-500/15 rounded-xl p-3 mb-3">
    <div class="text-xs text-red-300/60 font-bold mb-2">⚠️ リスク要因</div>
    <div class="space-y-1">
      ${risks.map(r => `<p class="text-xs text-white/50 leading-relaxed">• ${r}</p>`).join('')}
    </div>
  </div>

  <!-- 次Q注目 -->
  <div class="bg-indigo-500/5 border border-indigo-500/15 rounded-xl p-3">
    <div class="text-xs text-indigo-300/60 font-bold mb-1">🔭 次Q 注目ポイント</div>
    <p class="text-xs text-white/60 leading-relaxed">${watchPoint}</p>
  </div>

  <div class="mt-4 text-xs text-white/15 text-right">※ 本分析は会計データの定量処理に基づく参考情報です。投資判断はご自身の責任で行ってください。</div>
</div>`;
}

// ── Phase 1（赤字成長期）分析パネル ───────────────
function renderPhase1Panel(d) {
  const trend = d.trend ?? [];
  if (trend.length < 4) return '';
  const latest  = trend[0];
  const prev4   = trend[4] ?? null;
  const recent  = trend.slice(0, 6);

  // 粗利率トレンド
  const gmNow  = latest.grossMargin;
  const gm4q   = prev4?.grossMargin ?? null;
  const gmDelta4q = (gmNow !== null && gm4q !== null) ? +(gmNow - gm4q).toFixed(1) : null;

  // 連続粗利率改善チェック
  let consecutiveGMImprove = 0;
  for (let i = 0; i < recent.length - 1; i++) {
    if (recent[i].grossMargin !== null && recent[i+1].grossMargin !== null &&
        recent[i].grossMargin > recent[i+1].grossMargin) consecutiveGMImprove++;
    else break;
  }

  // OpExレバレッジ: 売上成長 vs OpEx成長
  const revNow4  = latest.revM;
  const rev4qAgo = prev4?.revM ?? null;
  const opExNow  = latest.opExRatio;
  const opEx4q   = prev4?.opExRatio ?? null;
  const opExLev  = (opExNow !== null && opEx4q !== null) ? +(opEx4q - opExNow).toFixed(1) : null;

  // 損益分岐シミュレーション
  const recentOpMDeltas = trend.slice(0, 5).map(q => q.opMDelta).filter(d => d !== null);
  const avgDelta = recentOpMDeltas.length > 0
    ? recentOpMDeltas.reduce((a,b) => a+b, 0) / recentOpMDeltas.length : null;
  const opMNow = latest.opMargin ?? null;
  const qtrsToBreakeven = (avgDelta !== null && avgDelta > 0 && opMNow !== null && opMNow < 0)
    ? Math.ceil(Math.abs(opMNow) / avgDelta) : null;

  // PSG
  const psRatio  = d.psRatio;
  const psgScore = d.psgScore;
  let psgLabel = '', psgColor = '';
  if (psgScore !== null) {
    if      (psgScore < 0.5)  { psgLabel = '💎 極めて割安（PSG<0.5）'; psgColor = 'text-emerald-300'; }
    else if (psgScore < 1.0)  { psgLabel = '✅ 割安圏（PSG<1.0）';     psgColor = 'text-emerald-400'; }
    else if (psgScore < 2.0)  { psgLabel = '⚖️ 適正水準（PSG 1〜2）';  psgColor = 'text-yellow-400'; }
    else                      { psgLabel = '⚠️ 割高気味（PSG>2.0）';   psgColor = 'text-orange-400'; }
  }

  // 修正RoF40（粗利率版）
  const rof40g = latest.rof40Gross;

  const noGMData = gmNow === null;

  return `

// ── 撤退シグナルパネル ──────────────────────────────
function renderExitSignalPanel(ex) {

                    : ex.exitLevel === 'caution' ? 'border-yellow-500/50'

  const signalRows = ex.signals.map(s => {
    const c = s.level === 'danger'  ? 'text-red-300'
            : s.level === 'warning' ? 'text-orange-300'
            : s.level === 'caution' ? 'text-yellow-300'

    return `<div class="flex items-start gap-2 py-1.5 border-b border-white/5 last:border-0">
      <span class="text-sm flex-shrink-0">${s.icon}</span>
      <span class="text-xs ${c} leading-relaxed">${s.text}</span>

  return `
  <div class="card rounded-2xl p-5 border ${borderColor} ${ex.exitBg}">

        <span class="text-lg">${ex.exitEmoji}</span>

          const range = high - low;

          const meanPct = Math.min(100, Math.max(0, (mean - low) / range * 100));
          return `<div class="absolute inset-y-0 left-0 bg-gradient-to-r from-red-500/40 to-emerald-500/40 rounded-full" style="width:100%"></div>

// ── 先行シグナルセクション読み込み（Phase 1） ─────────────
async function loadAdvanceSignals(ticker) {
  if (!ticker) return;

  const placeholder = document.getElementById('advanceSignalPlaceholder');
  if (!placeholder) return;

  try {
    // EPS Revisionデータ取得（キャッシュ利用）
    let epsData = null;
    try {
      const epsRes = await fetch(`/.netlify/functions/eps-revisions?ticker=${ticker}`);
      if (epsRes.ok) epsData = await epsRes.json();

let _chartInstance  = null;
let _chartTicker    = null;  // 初期化済みチャートの銘柄
let _activeTicker   = null;  // 現在分析中の銘柄（renderResultで設定）
let _chartTrend     = null;
let _chartAnalyst   = null;

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
  const btn     = document.getElementById('tab-' + name);
  const content = document.getElementById('tabcontent-' + name);
  if (btn) btn.classList.add('active');
  if (content) content.classList.remove('hidden');
  if (name === 'chart' && _activeTicker) initLightweightChart(_activeTicker, _chartTrend, _chartAnalyst);
  document.getElementById('result')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── ファンダメンタルズシグナル → Lightweight Chartsマーカー変換 ────────────
function buildFundamentalMarkers(trend, analyst) {
  const markers = [];

  (trend ?? []).forEach((q, i) => {
    if (!q.end) return;
    const ts  = q.end; // "YYYY-MM-DD" — Lightweight Charts accepts date strings
    const prev = (trend ?? [])[i + 1];

    // 参入シグナル（高スコア順で重複しないよう最優先のみ）
    if ((q.signalScore ?? 0) >= 75) {
      markers.push({ time: ts, position: 'aboveBar', color: '#ef4444', shape: 'arrowUp',
        text: `🚨 ${q.label}` });
    } else if ((q.signalScore ?? 0) >= 50) {
      markers.push({ time: ts, position: 'aboveBar', color: '#f97316', shape: 'arrowUp',
        text: `⚡ ${q.label}` });
    }

    // 🌱 黒字転換（営業利益）
    if (prev && prev.opM !== null && q.opM != null && prev.opM < 0 && q.opM >= 0) {
      markers.push({ time: ts, position: 'aboveBar', color: '#fbbf24', shape: 'circle',
        text: '🌱 黒字転換' });
    }

    // 📈 売上YoY加速（yoyAccel が正方向に転換）
    if (q.yoyAccel === 'up' && prev && (prev.yoyAccel === 'down' || prev.yoyAccel === null)) {
      markers.push({ time: ts, position: 'belowBar', color: '#6366f1', shape: 'arrowUp',
        text: '📈 売上加速' });
    }

    // ⚠️ 撤退警戒：売上YoY成長率が連続減速（i=0が最新 → チャート上では右端に近い）
    // trend[i].revYoY < trend[i+1].revYoY が2期連続の起点（i==1の位置）
    // i==0:最新、i==1:1期前、i==2:2期前 → 「3期連続」はi==1に⚠️, 「2期連続」もi==1に
    if (i === 1 && prev) {
      const r0 = (trend ?? [])[0]?.revYoY;
      const r1 = q.revYoY;
      const r2 = prev?.revYoY;
      if (r0 != null && r1 != null && r2 != null && r0 < r1 && r1 < r2) {
        markers.push({ time: ts, position: 'aboveBar', color: '#f97316', shape: 'arrowDown',
          text: '⚠️ 成長減速' });
      }
    }
  });

  // EPS Beat / Miss（アナリスト予想との乖離）
  (analyst?.epsHistory ?? []).forEach(h => {
    if (!h.quarter || h.beatPct === null) return;
    const ts = h.quarter; // "YYYY-MM-DD"
    if (h.beatPct > 10) {
      markers.push({ time: ts, position: 'belowBar', color: '#10b981', shape: 'arrowUp',
        text: `Beat +${h.beatPct.toFixed(0)}%` });
    } else if (h.beatPct < -5) {
      markers.push({ time: ts, position: 'belowBar', color: '#ef4444', shape: 'arrowDown',
        text: `Miss ${h.beatPct.toFixed(0)}%` });
    }
  });

  // time昇順ソート（必須）
  return markers.sort((a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : 0));
}

// ── Lightweight Charts 初期化 ───────────────────────────────────────────────
async function initLightweightChart(ticker, trend, analyst) {
  const container = document.getElementById('tv-chart-container');
  if (!container) return;
  // 同一銘柄は再描画しない
  if (_chartInstance && _chartTicker === ticker) return;

  // 前のインスタンスを破棄
  if (_chartInstance) { try { _chartInstance.remove(); } catch(_) {} _chartInstance = null; }

  container.innerHTML = `
    <div class="flex items-center justify-center h-full text-white/40 text-sm">
      <div class="text-center">
        <div class="spin text-3xl mb-3">◌</div>
        <div>チャートデータを取得中…</div>
        <div class="text-xs mt-1 text-white/20">${ticker} 週足 5年</div>
      </div>
    </div>`;

  try {
    // Netlify Function経由でYahoo Finance OHLCVを取得（CORS回避）
    const url = `/.netlify/functions/chart?ticker=${encodeURIComponent(ticker)}`;
    const res  = await fetch(url);
    const json = await res.json();
    const result = json?.chart?.result?.[0];
    if (!result) throw new Error('No chart data');

    const tss    = result.timestamp ?? [];
    const quote  = result.indicators?.quote?.[0] ?? {};
    const adjClose = result.indicators?.adjclose?.[0]?.adjclose ?? [];

    // date文字列変換（"YYYY-MM-DD"）
    const toDate = ts => {
      const d = new Date(ts * 1000);
      return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
    };

    const candles = tss.map((t, i) => ({
      time:  toDate(t),
      open:  +(quote.open[i]  ?? 0).toFixed(4),
      high:  +(quote.high[i]  ?? 0).toFixed(4),
      low:   +(quote.low[i]   ?? 0).toFixed(4),
      close: +(adjClose[i] ?? quote.close[i] ?? 0).toFixed(4),
    })).filter(c => c.open && c.high && c.low && c.close);

    const volumes = tss.map((t, i) => ({
      time:  toDate(t),
      value: quote.volume[i] ?? 0,
      color: (quote.close[i] ?? 0) >= (quote.open[i] ?? 0)
             ? 'rgba(16,185,129,0.35)' : 'rgba(239,68,68,0.35)',
    })).filter(v => v.value > 0);

    // チャート生成
    container.innerHTML = '';
    const chart = LightweightCharts.createChart(container, {
      width:  container.offsetWidth,
      height: container.offsetHeight - 2,
      layout: {
        background: { type: 'solid', color: 'transparent' },
        textColor:  'rgba(255,255,255,0.45)',
        fontSize:   11,
      },
      grid: {
        vertLines: { color: 'rgba(255,255,255,0.04)' },
        horzLines: { color: 'rgba(255,255,255,0.04)' },
      },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: 'rgba(255,255,255,0.08)' },
      timeScale: {
        borderColor:     'rgba(255,255,255,0.08)',
        timeVisible:     true,
        secondsVisible:  false,
        fixLeftEdge:     true,
        fixRightEdge:    true,
      },
      handleScroll:  true,
      handleScale:   true,
    });

    _chartInstance = chart;
    _chartTicker   = ticker;

    // ── ローソク足 ──
    const candleSeries = chart.addCandlestickSeries({
      upColor:        '#10b981',
      downColor:      '#ef4444',
      borderUpColor:  '#10b981',
      borderDownColor:'#ef4444',
      wickUpColor:    '#34d399',
      wickDownColor:  '#f87171',
    });
    candleSeries.setData(candles);

    // ── 出来高 ──
    const volSeries = chart.addHistogramSeries({
      priceFormat:  { type: 'volume' },
      priceScaleId: 'vol',
    });
    chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
    volSeries.setData(volumes);

    // ── 9週MA ──
    const period = 9;
    const maData = [];
    for (let i = period - 1; i < candles.length; i++) {
      const avg = candles.slice(i - period + 1, i + 1).reduce((s, c) => s + c.close, 0) / period;
      maData.push({ time: candles[i].time, value: +avg.toFixed(4) });
    }
    const maSeries = chart.addLineSeries({
      color:            '#818cf8',
      lineWidth:        2,
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    maSeries.setData(maData);

    // ── ファンダメンタルズマーカー ──
    const markers = buildFundamentalMarkers(trend, analyst);
    if (markers.length > 0) candleSeries.setMarkers(markers);

    // ── 凡例オーバーレイ ──
    const legend = document.createElement('div');
    legend.style.cssText = `
      position:absolute; top:8px; left:12px; z-index:10; pointer-events:none;
      font-size:11px; color:rgba(255,255,255,0.45); line-height:1.6;
    `;
    legend.innerHTML = `
      <span style="color:#818cf8">■</span> MA9週 &nbsp;
      <span style="color:#ef4444">▲</span> 参入シグナル &nbsp;
      <span style="color:#f97316">▲</span> 注目 &nbsp;
      <span style="color:#fbbf24">●</span> 黒字転換 &nbsp;

function getWatchlist() { return JSON.parse(localStorage.getItem('masyaWatchlist') || '[]'); }
function saveWatchlist(l) { localStorage.setItem('masyaWatchlist', JSON.stringify(l)); }
function toggleWatch(ticker) {
  const wl = getWatchlist();
  const idx = wl.indexOf(ticker);
  if (idx >= 0) wl.splice(idx, 1); else wl.push(ticker);
  saveWatchlist(wl);
  updateWatchBtn(ticker);
  updateSectorTabs();
}
function updateWatchBtn(ticker) {
  const watching = getWatchlist().includes(ticker);
  document.querySelectorAll(`.watch-btn[data-ticker="${ticker}"]`).forEach(b => {
    b.textContent = watching ? '★ ウォッチ中' : '☆ ウォッチ';
    b.classList.toggle('watching', watching);
  });
}

  '🔍 動的スキャン':  null,  // nullは動的モードを示す
  'AIハイグロース': ['NVDA','META','GOOGL','MSFT','APP','PLTR','CRWD','DDOG','SNOW','MDB','ZS','NET','AI','IONQ','SOUN'],
  '半導体':         ['AMD','AVGO','QCOM','MU','AMAT','LRCX','KLAC','TXN','MRVL','ARM','ON','NXPI','SMCI','ASML','TSM'],
  'SaaS':           ['NOW','CRM','ADBE','INTU','TEAM','MNDY','HUBS','TTD','OKTA','BILL','GTLB','CFLT','S','FOUR','SMAR'],
  'コンシューマー': ['AAPL','TSLA','AMZN','NFLX','SPOT','UBER','ABNB','BKNG','LYFT','DIS'],
  'FinTech':        ['V','MA','COIN','PYPL','SQ','NU','AFRM','SOFI','HOOD','UPST'],
  'その他':         ['RKLB','AXON','NVO','LLY','ISRG','TMO','DECK','RCL','AXON','LMT'],
  'ウォッチリスト': [],
};
let _activeSector    = '🔍 動的スキャン';
let _screenerMinScore = 60;
let _screenerRunning  = false;
let _screenerResults  = [];

function updateSectorTabs() {
  const wl = getWatchlist();
  SECTOR_TICKERS['ウォッチリスト'] = [...wl];
  document.querySelectorAll('.sector-tab').forEach(btn => {
    const s = btn.dataset.sector;
    if (s === 'ウォッチリスト') {
      btn.textContent = `★ ウォッチリスト (${wl.length})`;
    }
  });
}

function initSectorTabs() {
  const container = document.getElementById('sectorTabs');
  if (!container) return;
  const sectors = Object.keys(SECTOR_TICKERS);
  container.innerHTML = '';
  sectors.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'sector-tab' + (s === _activeSector ? ' active' : '');
    btn.dataset.sector = s;
    btn.textContent = s === 'ウォッチリスト'
      ? `★ ウォッチリスト (${getWatchlist().length})`
      : s;
    btn.onclick = () => {
      _activeSector = s;
      document.querySelectorAll('.sector-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    container.appendChild(btn);
  });
}

async function runScreener() {
  if (_screenerRunning) return;

  const isDynamic = SECTOR_TICKERS[_activeSector] === null;
  const tickers   = isDynamic ? [] : (SECTOR_TICKERS[_activeSector] ?? []);
  const minScore  = _screenerMinScore;

  if (!isDynamic && tickers.length === 0) {
    document.getElementById('screenerTable').innerHTML =
      '<p class="text-white/30 text-sm text-center py-8">銘柄がありません</p>';
    return;
  }

  _screenerRunning = true;
  const btn = document.getElementById('screenerBtn');
  if (btn) btn.disabled = true;

  const progress    = document.getElementById('screenerProgress');
  const progressBar = document.getElementById('screenerProgressBar');
  const statusEl    = document.getElementById('screenerStatus');
  const tableEl     = document.getElementById('screenerTable');

  progress.classList.remove('hidden');
  tableEl.innerHTML = '';

  // ── 動的スキャンモード ──
  if (isDynamic) {
    // Step1: 銘柄プールを取得（即座に返る）
    statusEl.textContent = '🔍 $10B+成長株プールを読み込み中...';
    progressBar.style.width = '3%';
    let poolTickers = [];
    try {
      const poolResp = await fetch('/.netlify/functions/screener', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'getpool' }),
      });
      const poolData = await poolResp.json();
      poolTickers = Array.isArray(poolData) ? poolData : [];
    } catch(e) {
      statusEl.textContent = `❌ エラー: ${e.message}`;
      _screenerRunning = false;
      if (btn) btn.disabled = false;
      progress.classList.add('hidden');
      return;
    }

    if (poolTickers.length === 0) {
      statusEl.textContent = '❌ プール取得失敗';
      _screenerRunning = false;
      if (btn) btn.disabled = false;
      progress.classList.add('hidden');
      return;
    }

    statusEl.textContent = `${poolTickers.length}銘柄のSEC分析を開始...`;
    progressBar.style.width = '5%';

    // Step2: 既存バッチ方式でSEC分析（10銘柄/コール）
    const BATCH = 10;
    let results = [];
    for (let i = 0; i < poolTickers.length; i += BATCH) {
      const batch = poolTickers.slice(i, i + BATCH);
      const pct = 5 + Math.round((i / poolTickers.length) * 90);
      progressBar.style.width = pct + '%';
      statusEl.textContent = `SEC分析中... ${i + 1}〜${Math.min(i + BATCH, poolTickers.length)} / ${poolTickers.length}銘柄`;
      try {
        const resp = await fetch('/.netlify/functions/screener', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tickers: batch }),
        });
        const batchResults = await resp.json();
        if (Array.isArray(batchResults)) results.push(...batchResults);
      } catch(e) { console.error('dynamic screener batch error:', e); }
    }

    // Step3: 複合スコア計算（シグナル60% + 売上成長25% + モメンタム15%）
    results = results
      .filter(r => !r.error)
      .map(r => {
        const yoyNorm = Math.min(100, Math.max(0, (r.revYoY ?? 0) * 1.5));
        const momNorm = Math.min(100, Math.max(0, 100 + (r.chg52wHigh ?? -50)));
        const compositeScore = Math.round(
          (r.signalScore ?? 0) * 0.6 + yoyNorm * 0.25 + momNorm * 0.15
        );
        return { ...r, compositeScore };
      })
      .sort((a, b) => (b.compositeScore ?? 0) - (a.compositeScore ?? 0));

    progressBar.style.width = '100%';
    statusEl.textContent = `✅ ${results.length}銘柄のスキャン完了`;
    _screenerResults = results;
    _screenerRunning = false;
    if (btn) btn.disabled = false;
    progress.classList.add('hidden');
    renderScreenerTable(_screenerResults, true);
    return;
  }

  // ── 通常モード（セクタータブ）──
  const BATCH = 10;
  let results = [];
  for (let i = 0; i < tickers.length; i += BATCH) {
    const batch = tickers.slice(i, i + BATCH);
    const pct   = Math.round((i / tickers.length) * 90);
    progressBar.style.width = pct + '%';
    statusEl.textContent    = `分析中... ${i + 1}〜${Math.min(i + BATCH, tickers.length)} / ${tickers.length}`;
    try {
      const resp = await fetch('/.netlify/functions/screener', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tickers: batch }),
      });
      const batchResults = await resp.json();
      if (Array.isArray(batchResults)) results.push(...batchResults);
    } catch(e) { console.error('screener batch error:', e); }
  }

  progressBar.style.width = '100%';
  statusEl.textContent    = `完了 — ${results.length}銘柄分析`;
  _screenerResults = results;
  _screenerRunning = false;
  if (btn) btn.disabled = false;
  progress.classList.add('hidden');
  renderScreenerTable(_screenerResults, false);
}

function renderScreenerTable(results, isDynamic = false) {
  const minScore = _screenerMinScore;
  const tableEl  = document.getElementById('screenerTable');
  const statusEl = document.getElementById('screenerStatus');

  const filtered = isDynamic
    ? results.filter(r => !r.error)  // 動的モードはバックエンドでソート済み
    : results
        .filter(r => !r.error && (r.signalScore ?? 0) >= minScore)
        .sort((a, b) => (b.signalScore ?? 0) - (a.signalScore ?? 0));

  if (!isDynamic) {
    statusEl.textContent = `完了 — ${filtered.length}/${results.length}銘柄がスコア${minScore}以上`;
  }

  if (filtered.length === 0) {
    tableEl.innerHTML = isDynamic
      ? '<p class="text-white/30 text-sm text-center py-8">結果がありません</p>'
      : `<p class="text-white/30 text-sm text-center py-8">スコア${minScore}以上の銘柄が見つかりませんでした</p>`;
    return;
  }

  const scoreColor = s => s >= 70 ? 'text-red-300 bg-red-500/15' : s >= 60 ? 'text-orange-300 bg-orange-500/10' : s >= 40 ? 'text-white/40 bg-white/5' : 'text-white/20';
  const compColor  = s => s >= 70 ? 'text-cyan-300 bg-cyan-500/15' : s >= 50 ? 'text-cyan-400 bg-cyan-500/10' : s >= 30 ? 'text-white/40 bg-white/5' : 'text-white/20';
  const fmtPct = v => v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(1) + '%';
  const fmtMktCap = v => {
    if (!v) return '—';
    if (v >= 1e12) return (v / 1e12).toFixed(1) + '兆ドル';
    if (v >= 1e8)  return Math.round(v / 1e8) + '億ドル';
    return (v / 1e6).toFixed(0) + 'M';
  };
  const phaseLabel = p => p === 'phase1' ? '<span class="text-purple-400 text-xs">🌱P1</span>' : p === 'phase3' ? '<span class="text-emerald-400 text-xs">🏆P3</span>' : '<span class="text-white/30 text-xs">P2</span>';

  tableEl.innerHTML = `
<table class="w-full text-sm">
  <thead>
    <tr>
      <th class="px-2 py-1.5 text-left text-xs text-white/35 font-normal border-b border-white/8">銘柄</th>
      <th class="px-2 py-1.5 text-right text-xs text-white/35 font-normal border-b border-white/8" title="${isDynamic ? '複合スコア (signalScore×0.6 + YoY×0.25 + モメンタム×0.15)' : 'シグナルスコア'}">${isDynamic ? '複合Score' : 'Score'}</th>
      <th class="px-2 py-1.5 text-right text-xs text-white/35 font-normal border-b border-white/8">時価総額</th>
      <th class="px-2 py-1.5 text-right text-xs text-white/35 font-normal border-b border-white/8">売上YoY</th>
      <th class="px-2 py-1.5 text-right text-xs text-white/35 font-normal border-b border-white/8">加速</th>
      <th class="px-2 py-1.5 text-right text-xs text-white/35 font-normal border-b border-white/8">営業利益率</th>
      <th class="px-2 py-1.5 text-right text-xs text-white/35 font-normal border-b border-white/8">RoF40</th>
      <th class="px-2 py-1.5 text-right text-xs text-white/35 font-normal border-b border-white/8">株価</th>
      <th class="px-2 py-1.5 text-right text-xs text-white/35 font-normal border-b border-white/8">1日</th>
      <th class="px-2 py-1.5 text-right text-xs text-white/35 font-normal border-b border-white/8">フェーズ</th>
    </tr>
  </thead>
  <tbody>
    ${filtered.map(r => `
      <tr class="sc-row border-b border-white/5" onclick="selectScreenerTicker('${r.ticker}')">
        <td class="px-2 py-2 text-left">
          <span class="font-bold text-white">${r.ticker}</span>
          <span class="text-white/30 text-xs ml-1 hidden sm:inline">${(r.name ?? '').substring(0, 20)}</span>
        </td>
        <td class="px-2 py-2 text-right">
          ${isDynamic
            ? `<span class="inline-flex items-center justify-center w-9 h-5 rounded text-xs font-bold ${compColor(r.compositeScore ?? 0)}">${r.compositeScore ?? '—'}</span>
               <span class="text-white/20 text-xs ml-1">(${r.signalScore})</span>`
            : `<span class="inline-flex items-center justify-center w-9 h-5 rounded text-xs font-bold ${scoreColor(r.signalScore)}">${r.signalScore}</span>`
          }
        </td>
        <td class="px-2 py-2 text-right text-white/50 text-xs">${fmtMktCap(r.mktcap)}</td>
        <td class="px-2 py-2 text-right ${r.revYoY > 0 ? 'text-emerald-400' : 'text-red-400'}">${fmtPct(r.revYoY)}</td>
        <td class="px-2 py-2 text-right ${r.yoyAccel > 5 ? 'text-emerald-400' : r.yoyAccel < 0 ? 'text-red-400' : 'text-white/50'}">${fmtPct(r.yoyAccel)}</td>
        <td class="px-2 py-2 text-right ${r.opMargin > 15 ? 'text-emerald-400' : r.opMargin > 0 ? 'text-white/70' : 'text-red-400'}">${r.opMargin != null ? r.opMargin.toFixed(1) + '%' : '—'}</td>
        <td class="px-2 py-2 text-right ${r.rof40 >= 60 ? 'text-emerald-400' : r.rof40 >= 40 ? 'text-yellow-400' : 'text-white/40'}">${r.rof40 != null ? r.rof40.toFixed(0) : '—'}</td>
        <td class="px-2 py-2 text-right text-white/70">${r.price != null ? '$' + r.price.toFixed(2) : '—'}</td>
        <td class="px-2 py-2 text-right ${r.chg1d > 0 ? 'text-emerald-400' : r.chg1d < 0 ? 'text-red-400' : 'text-white/40'}">${r.chg1d != null ? (r.chg1d > 0 ? '+' : '') + r.chg1d.toFixed(2) + '%' : '—'}</td>
        <td class="px-2 py-2 text-right">${phaseLabel(r.phase)}</td>
      </tr>
    `).join('')}
  </tbody>
</table>`;
}

function selectScreenerTicker(ticker) {
  document.getElementById('tickerInput').value = ticker;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  analyze();
}

// 初期化
initSectorTabs();

</script>
</body>
</html>
